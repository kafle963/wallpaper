<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interactive Blob Wallpaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0713;
    --bg-mid: #150f28;
    --bg-glow: #1f1638;
    --bg-card: rgba(21, 15, 40, 0.88);
    
    --blob-a: #ff9d7a;
    --blob-b: #ff5f8f;
    --eye-white: #fdf9f4;
    --pupil: #1c1420;
    --hint: rgba(253, 249, 244, 0.4);
    
    --text-primary: #fdf9f4;
    --text-accent: #ff8a5b;
    --text-dim: rgba(253, 249, 244, 0.45);
    --border-color: rgba(255, 138, 91, 0.35);

    --font-active: 'Press Start 2P', monospace;
    --greet-scale: 1;
    --creature-scale: 1;
  }

  [data-theme="terracotta"] {
    --bg-deep: #080608;
    --bg-mid: #140d11;
    --bg-glow: #24141a;
    --bg-card: rgba(20, 13, 17, 0.9);
    --blob-a: #d56e4c;
    --blob-b: #e8734a;
    --text-primary: #f2e3d5;
    --text-accent: #d56e4c;
    --border-color: rgba(213, 110, 76, 0.4);
  }

  [data-theme="gameboy"] {
    --bg-deep: #0f380f;
    --bg-mid: #184818;
    --bg-glow: #245824;
    --bg-card: rgba(15, 56, 15, 0.92);
    --blob-a: #8bac0f;
    --blob-b: #9bbc0f;
    --eye-white: #e0f0c0;
    --pupil: #0f380f;
    --text-primary: #9bbc0f;
    --text-accent: #8bac0f;
    --text-dim: rgba(155, 188, 15, 0.5);
    --border-color: #8bac0f;
  }

  [data-theme="cyberpunk"] {
    --bg-deep: #080018;
    --bg-mid: #150030;
    --bg-glow: #280050;
    --bg-card: rgba(20, 0, 45, 0.92);
    --blob-a: #00ffcc;
    --blob-b: #ff007f;
    --eye-white: #ffffff;
    --pupil: #080018;
    --text-primary: #ffffff;
    --text-accent: #00ffcc;
    --text-dim: rgba(0, 255, 204, 0.5);
    --border-color: #00ffcc;
  }

  [data-theme="synthwave"] {
    --bg-deep: #120424;
    --bg-mid: #220840;
    --bg-glow: #380d60;
    --bg-card: rgba(34, 8, 64, 0.92);
    --blob-a: #ff71ce;
    --blob-b: #01cdfe;
    --eye-white: #ffffff;
    --pupil: #120424;
    --text-primary: #fffb96;
    --text-accent: #ff71ce;
    --text-dim: rgba(255, 113, 206, 0.5);
    --border-color: #ff71ce;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--font-active);
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.4s ease, color 0.4s ease;
  }

  body {
    position: relative;
    background: radial-gradient(120% 90% at 50% 35%, var(--bg-glow) 0%, var(--bg-mid) 45%, var(--bg-deep) 100%);
    touch-action: none;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* Optional CRT Overlay */
  #crtOverlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%);
    background-size: 100% 4px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #crtOverlay.enabled { opacity: 0.6; }

  /* Ambient Stars */
  #stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #stars span {
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
    opacity: 0.5;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.75; }
  }

  /* Sleek Collapsible Gear Widget */
  #gearWidget {
    position: absolute;
    top: calc(16px + env(safe-area-inset-top, 0px));
    right: 18px;
    display: flex;
    align-items: center;
    background: var(--bg-card);
    border: 2px solid var(--border-color);
    box-shadow: 2px 2px 0px var(--border-color);
    backdrop-filter: blur(8px);
    z-index: 30;
    opacity: 0.35;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 4px;
    overflow: hidden;
  }
  #gearWidget:hover, #gearWidget.active {
    opacity: 1;
    box-shadow: 4px 4px 0px var(--border-color);
  }

  .gear-trigger {
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-family: var(--font-active);
    font-size: 16px;
    width: 36px;
    height: 36px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
    transition: transform 0.3s ease, color 0.2s ease;
  }
  #gearWidget:hover .gear-trigger, #gearWidget.active .gear-trigger {
    transform: rotate(90deg);
    color: var(--text-accent);
  }

  .gear-menu {
    display: flex;
    align-items: center;
    gap: 4px;
    max-width: 0;
    opacity: 0;
    overflow: hidden;
    white-space: nowrap;
    transition: max-width 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease, padding 0.35s ease;
    padding-right: 0;
  }
  #gearWidget:hover .gear-menu, #gearWidget.active .gear-menu {
    max-width: 240px;
    opacity: 1;
    padding-right: 6px;
  }

  .gear-btn {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    font-family: var(--font-active);
    font-size: 11px;
    padding: 6px 10px;
    cursor: pointer;
    outline: none;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gear-btn:hover {
    background: var(--text-accent);
    color: var(--bg-deep);
  }
  .gear-btn:active {
    transform: scale(0.94);
  }

  /* Original Blob Creature */
  #creatureWrap {
    position: absolute;
    width: calc(min(40vh, 40vw, 300px) * var(--creature-scale));
    height: calc(min(40vh, 40vw, 300px) * var(--creature-scale));
    left: 0;
    top: 0;
    cursor: grab;
    touch-action: none;
    will-change: transform;
    z-index: 20;
  }
  #creatureWrap.dragging { cursor: grabbing; }
  #creatureWrap svg { width: 100%; height: 100%; display: block; overflow: visible; }

  #ball {
    position: absolute;
    width: 42px;
    height: 42px;
    pointer-events: none;
    opacity: 0;
    left: 0;
    top: 0;
    will-change: transform;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
    z-index: 15;
  }
  #ball svg { width: 100%; height: 100%; overflow: visible; }

  /* Greeting Container */
  #greeting {
    position: absolute;
    top: 9vh;
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 10;
    padding: 0 24px;
  }

  #greeting .line1 {
    font-family: var(--font-active);
    font-size: calc(clamp(16px, 4.2vw, 42px) * var(--greet-scale));
    letter-spacing: -0.01em;
    line-height: 1.35;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text-primary);
  }

  #greeting .typed {
    background: linear-gradient(180deg, #ffd9c2, var(--text-accent) 85%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 35px rgba(255, 138, 91, 0.3);
  }

  #greeting .cursor {
    display: inline-block;
    width: 0.5em;
    height: 1.0em;
    background: var(--text-accent);
    margin-left: 4px;
    animation: blink 0.9s step-end infinite;
    vertical-align: -0.1em;
  }
  @keyframes blink { 50% { opacity: 0; } }

  #greeting .line2 {
    margin-top: 14px;
    font-family: var(--font-active);
    font-size: calc(clamp(10px, 1.6vw, 15px) * var(--greet-scale));
    letter-spacing: 0.05em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* Particles */
  #particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 25;
  }
  .particle {
    position: absolute;
    pointer-events: none;
    font-size: 20px;
    line-height: 1;
    opacity: 0.95;
    animation: floatUp 1.1s ease-out forwards;
  }
  .particle.zzz {
    font-family: var(--font-active);
    font-size: 14px;
    color: var(--text-dim);
    animation: floatZzz 1.8s ease-out forwards;
  }
  @keyframes floatUp {
    0% { transform: translate(0,0) scale(0.6); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translate(var(--dx,0px), -70px) scale(1.1); opacity: 0; }
  }
  @keyframes floatZzz {
    0% { transform: translate(0,0) scale(0.5); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(14px,-46px) scale(1); opacity: 0; }
  }

  #hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(4vh + env(safe-area-inset-bottom, 0px));
    text-align: center;
    color: var(--hint);
    font-family: var(--font-active);
    font-size: clamp(9px, 1.2vw, 12px);
    letter-spacing: 0.04em;
    transition: opacity 1.2s ease;
    pointer-events: none;
    padding: 0 20px;
    z-index: 10;
  }

  /* Settings Modal / Flexibility Drawer */
  #modalBackdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(6px);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #modalBackdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  #settingsModal {
    background: var(--bg-card);
    border: 2px solid var(--border-color);
    box-shadow: 6px 6px 0px var(--border-color);
    width: min(520px, 92vw);
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px;
    color: var(--text-primary);
    font-family: var(--font-active);
    transform: scale(0.95);
    transition: transform 0.2s ease;
  }
  #modalBackdrop.open #settingsModal {
    transform: scale(1);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px dashed var(--border-color);
    padding-bottom: 14px;
    margin-bottom: 20px;
  }
  .modal-title {
    font-size: 13px;
    color: var(--text-accent);
    letter-spacing: 0.05em;
  }

  .setting-group { margin-bottom: 20px; }
  .setting-label {
    font-size: 10px;
    margin-bottom: 8px;
    color: var(--text-primary);
    display: block;
    letter-spacing: 0.04em;
  }

  .setting-options {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
  }

  .option-btn {
    background: rgba(0, 0, 0, 0.35);
    border: 2px solid rgba(255, 255, 255, 0.15);
    color: var(--text-primary);
    font-family: var(--font-active);
    font-size: 10px;
    padding: 8px 6px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
  }
  .option-btn:hover { border-color: var(--text-accent); }
  .option-btn.active {
    background: var(--text-accent);
    color: var(--bg-deep);
    border-color: var(--text-accent);
    box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
  }

  .setting-input {
    width: 100%;
    background: rgba(0, 0, 0, 0.35);
    border: 2px solid var(--border-color);
    color: var(--text-primary);
    font-family: var(--font-active);
    font-size: 11px;
    padding: 10px;
    outline: none;
  }

  .range-slider {
    width: 100%;
    accent-color: var(--text-accent);
    cursor: pointer;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
  }

  #settingsModal::-webkit-scrollbar { width: 6px; }
  #settingsModal::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
  #settingsModal::-webkit-scrollbar-thumb { background: var(--border-color); }
</style>
</head>
<body>

<div id="crtOverlay"></div>
<div id="stars"></div>

<!-- Sleek Collapsible Gear Widget -->
<div id="gearWidget">
  <button id="gearTrigger" class="gear-trigger" title="Settings & Text Size">⚙</button>
  <div class="gear-menu">
    <button class="gear-btn" id="sizeDown" title="Smaller Text">–</button>
    <button class="gear-btn" id="sizeUp" title="Bigger Text">+</button>
    <button class="gear-btn" id="openSettings" title="Full Settings">MENU</button>
  </div>
</div>

<!-- Greeting -->
<div id="greeting">
  <div class="line1"><span class="typed" id="greetingText"></span><span class="cursor"></span></div>
  <div class="line2" id="greetingLine2">Tuesday, September 22</div>
</div>

<div id="particles"></div>

<!-- Jelly Ball -->
<div id="ball">
  <svg viewBox="0 0 100 100">
    <defs>
      <radialGradient id="jellyGrad" cx="35%" cy="28%" r="75%">
        <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.95"/>
        <stop offset="45%" stop-color="#ff8a5b" stop-opacity="0.88"/>
        <stop offset="100%" stop-color="#e2492f" stop-opacity="0.82"/>
      </radialGradient>
    </defs>
    <g id="jellyGroup">
      <ellipse cx="50" cy="50" rx="42" ry="42" fill="url(#jellyGrad)" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
      <ellipse cx="36" cy="32" rx="13" ry="8" fill="#ffffff" opacity="0.5"/>
      <ellipse cx="50" cy="50" rx="42" ry="42" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    </g>
  </svg>
</div>

<!-- Original Blob Creature -->
<div id="creatureWrap">
  <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="blobGrad" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="var(--blob-a)"/>
        <stop offset="100%" stop-color="var(--blob-b)"/>
      </radialGradient>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
    </defs>

    <g id="squashGroup">
      <ellipse id="shadow" cx="200" cy="330" rx="110" ry="18" fill="#000000" opacity="0.25" filter="url(#soft)"/>

      <g id="bodyGroup">
        <path id="blobBody" fill="url(#blobGrad)"/>

        <g id="browL"><rect x="-22" y="-6" width="44" height="9" rx="4.5" fill="var(--pupil)" opacity="0.85"/></g>
        <g id="browR"><rect x="-22" y="-6" width="44" height="9" rx="4.5" fill="var(--pupil)" opacity="0.85"/></g>

        <g id="leftEyeGroup">
          <ellipse id="leftSclera" cx="0" cy="0" rx="34" ry="40" fill="var(--eye-white)"/>
          <circle id="leftPupil" cx="0" cy="0" r="15" fill="var(--pupil)"/>
          <circle id="leftShine" cx="-5" cy="-6" r="4.5" fill="#ffffff"/>
        </g>
        <g id="rightEyeGroup">
          <ellipse id="rightSclera" cx="0" cy="0" rx="34" ry="40" fill="var(--eye-white)"/>
          <circle id="rightPupil" cx="0" cy="0" r="15" fill="var(--pupil)"/>
          <circle id="rightShine" cx="-5" cy="-6" r="4.5" fill="#ffffff"/>
        </g>

        <path id="mouthSmile" fill="none" stroke="var(--pupil)" stroke-width="6" stroke-linecap="round"/>
        <ellipse id="mouthO" cx="200" cy="262" rx="12" ry="14" fill="var(--pupil)" opacity="0"/>
        <line id="mouthSleep" x1="185" y1="260" x2="215" y2="260" stroke="var(--pupil)" stroke-width="5" stroke-linecap="round" opacity="0"/>

        <ellipse id="leftCheek" cx="128" cy="235" rx="22" ry="12" fill="#ffffff" opacity="0" filter="url(#soft)"/>
        <ellipse id="rightCheek" cx="272" cy="235" rx="22" ry="12" fill="#ffffff" opacity="0" filter="url(#soft)"/>
      </g>
    </g>
  </svg>
</div>

<div id="hint">move, click, or drag it — everything is flexible ⚙</div>

<!-- Settings Modal / Flexibility Drawer -->
<div id="modalBackdrop">
  <div id="settingsModal">
    <div class="modal-header">
      <div class="modal-title">⚙ FLEXIBILITY & SETTINGS</div>
      <button class="gear-btn" id="closeModal">✕</button>
    </div>

    <!-- Font Selector -->
    <div class="setting-group">
      <label class="setting-label">1. TEXT FONT TYPE</label>
      <div class="setting-options" id="fontOptions">
        <button class="option-btn active" data-font="'Press Start 2P', monospace">Press Start</button>
        <button class="option-btn" data-font="'Silkscreen', monospace">Silkscreen</button>
        <button class="option-btn" data-font="'Pixelify Sans', sans-serif">Pixelify</button>
        <button class="option-btn" data-font="'VT323', monospace">VT323</button>
        <button class="option-btn" data-font="'Fraunces', serif">Fraunces</button>
      </div>
    </div>

    <!-- Color Palette -->
    <div class="setting-group">
      <label class="setting-label">2. COLOR PALETTE</label>
      <div class="setting-options" id="themeOptions">
        <button class="option-btn active" data-theme="default">Cosmic Glow</button>
        <button class="option-btn" data-theme="terracotta">Terracotta</button>
        <button class="option-btn" data-theme="gameboy">GameBoy</button>
        <button class="option-btn" data-theme="cyberpunk">Cyberpunk</button>
        <button class="option-btn" data-theme="synthwave">Synthwave</button>
      </div>
    </div>

    <!-- Custom Greeting Name -->
    <div class="setting-group">
      <label class="setting-label">3. CUSTOM NAME / GREETING</label>
      <input type="text" id="customNameInput" class="setting-input" value="Aayush" placeholder="Enter name...">
    </div>

    <!-- Text Scale Slider + Buttons -->
    <div class="setting-group">
      <label class="setting-label" id="textScaleLabel">4. TEXT SCALE (1.0x)</label>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button class="gear-btn" id="modalSizeDown" style="padding: 6px 12px; font-size: 12px;">–</button>
        <input type="range" id="textScaleSlider" class="range-slider" min="0.6" max="2.0" step="0.05" value="1.0" style="flex: 1;">
        <button class="gear-btn" id="modalSizeUp" style="padding: 6px 12px; font-size: 12px;">+</button>
      </div>
    </div>

    <!-- Creature Scale Slider -->
    <div class="setting-group">
      <label class="setting-label" id="creatureScaleLabel">5. CREATURE SCALE (1.0x)</label>
      <input type="range" id="creatureScaleSlider" class="range-slider" min="0.6" max="1.8" step="0.05" value="1.0">
    </div>

    <!-- Audio & CRT Toggles -->
    <div class="setting-group">
      <label class="setting-label">6. RETRO EFFECTS & AUDIO</label>
      <div class="toggle-row">
        <span>CRT Scanlines Filter</span>
        <button class="gear-btn" id="toggleCrt">OFF</button>
      </div>
      <div class="toggle-row">
        <span>8-Bit Sound FX</span>
        <button class="gear-btn" id="toggleAudio">OFF</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------------- Web Audio Synth ----------------
  var soundEnabled = false;
  var audioCtx = null;

  function play8BitSound(type) {
    if (!soundEnabled) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      var nowTime = audioCtx.currentTime;

      if (type === 'jump') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(160, nowTime);
        osc.frequency.exponentialRampToValueAtTime(640, nowTime + 0.15);
        gain.gain.setValueAtTime(0.1, nowTime);
        gain.gain.linearRampToValueAtTime(0.01, nowTime + 0.15);
        osc.start(nowTime); osc.stop(nowTime + 0.15);
      } else if (type === 'click') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(440, nowTime);
        osc.frequency.setValueAtTime(880, nowTime + 0.05);
        gain.gain.setValueAtTime(0.08, nowTime);
        gain.gain.linearRampToValueAtTime(0.01, nowTime + 0.08);
        osc.start(nowTime); osc.stop(nowTime + 0.08);
      } else if (type === 'bounce') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, nowTime);
        osc.frequency.exponentialRampToValueAtTime(140, nowTime + 0.12);
        gain.gain.setValueAtTime(0.12, nowTime);
        gain.gain.linearRampToValueAtTime(0.01, nowTime + 0.12);
        osc.start(nowTime); osc.stop(nowTime + 0.12);
      } else if (type === 'pet') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, nowTime);
        osc.frequency.setValueAtTime(659.25, nowTime + 0.08);

    ball.wobble += ball.wobbleVel * dt;

    if (startled) { setMoodTarget('startled'); }
    else if (mode === 'sleep') { setMoodTarget('sleep'); }
    else if (mode === 'happy') { setMoodTarget('happy'); }
    else if (mode === 'chase') { setMoodTarget('chase'); }
    else if (mode === 'tailspin') { setMoodTarget('dizzy'); }
    else if (mode === 'drag') { setMoodTarget('drag'); }
    else {
      var sinceMove = timeNow - cursor.lastMoveTime;
      setMoodTarget(sinceMove < 900 ? 'curious' : 'idle');
    }

    var lookX, lookY;
    var eyeOriginX = creature.x;
    var eyeOriginY = creature.y - half * 0.55 + jumpOffset;
    if (mode === 'chase' && ball.active) {
      var bdx = ball.x - eyeOriginX, bdy = ball.y - eyeOriginY;
      var bdist = Math.hypot(bdx, bdy);
      var bang = Math.atan2(bdy, bdx);
      var br = Math.min(PUPIL_RANGE, PUPIL_RANGE * (bdist / 140));
      lookX = Math.cos(bang) * br; lookY = Math.sin(bang) * br * 0.85;
    } else if (mode === 'tailspin' || mode === 'sleep' || mode === 'drag') {
      lookX = 0; lookY = 2;
    } else {
      var cdx = cursor.x - eyeOriginX, cdy = cursor.y - eyeOriginY;
      var cdist = Math.hypot(cdx, cdy);
      var cang = Math.atan2(cdy, cdx);
      var cr = Math.min(PUPIL_RANGE, PUPIL_RANGE * (cdist / 200));
      lookX = Math.cos(cang) * cr; lookY = Math.sin(cang) * cr * 0.85;
    }

    lpx = lerp(lpx, lookX, 0.18);
    lpy = lerp(lpy, lookY, 0.18);
    rpx = lerp(rpx, lookX, 0.18);
    rpy = lerp(rpy, lookY, 0.18);

    if (mode !== 'sleep') {
      if (!blinking && timeNow > nextBlinkAt) { blinking = true; blinkStart = timeNow; }
      if (blinking) {
        var bp = (timeNow - blinkStart) / BLINK_DUR;
        if (bp < 1) { blinkT = Math.sin(bp * Math.PI); }
        else { blinkT = 0; blinking = false; nextBlinkAt = timeNow + 2200 + Math.random() * 3200; }
      }
    } else {
      blinkT = lerp(blinkT, 0.92, 0.15);
    }

    var scleraScaleY = startled ? Math.max(0.06, (1 - blinkT)) * 1.18 : Math.max(0.06, 1 - blinkT);
    scleraScaleY = clamp(scleraScaleY, 0.06, 1.25);

    exprCur.browY = lerp(exprCur.browY, expr.browY, 0.12);
    exprCur.browAngle = lerp(exprCur.browAngle, expr.browAngle, 0.12);
    exprCur.mouthWidth = lerp(exprCur.mouthWidth, expr.mouthWidth, 0.14);
    exprCur.mouthCurve = lerp(exprCur.mouthCurve, expr.mouthCurve, 0.14);
    exprCur.smileOp = lerp(exprCur.smileOp, expr.smileOp, 0.15);
    exprCur.oOp = lerp(exprCur.oOp, expr.oOp, 0.2);
    exprCur.sleepOp = lerp(exprCur.sleepOp, expr.sleepOp, 0.12);
    exprCur.blush = lerp(exprCur.blush, expr.blush, 0.1);

    var bodySquishX = 1 + breathe + breatheSleep;
    var bodySquishY = 1 - breathe - breatheSleep * 0.6;
    var w = 130 * bodySquishX, h = 120 * bodySquishY;
    var cx = 200, cy = 215;
    var top = cy - h, bottom = cy + h * 1.05, left = cx - w, right = cx + w;
    blobBody.setAttribute('d',
      'M ' + cx + ' ' + top +
      ' C ' + (cx + w * 0.72) + ' ' + top + ' ' + right + ' ' + (cy - h * 0.35) + ' ' + right + ' ' + (cy + h * 0.15) +
      ' C ' + right + ' ' + (bottom - h * 0.15) + ' ' + (cx + w * 0.55) + ' ' + bottom + ' ' + cx + ' ' + bottom +
      ' C ' + (cx - w * 0.55) + ' ' + bottom + ' ' + left + ' ' + (bottom - h * 0.15) + ' ' + left + ' ' + (cy + h * 0.15) +
      ' C ' + left + ' ' + (cy - h * 0.35) + ' ' + (cx - w * 0.72) + ' ' + top + ' ' + cx + ' ' + top + ' Z'
    );

    leftEyeGroup.setAttribute('transform', 'translate(' + EYE_L.x + ',' + EYE_L.y + ') scale(1,' + scleraScaleY + ')');
    rightEyeGroup.setAttribute('transform', 'translate(' + EYE_R.x + ',' + EYE_R.y + ') scale(1,' + scleraScaleY + ')');
    leftPupil.setAttribute('cx', lpx); leftPupil.setAttribute('cy', lpy);
    rightPupil.setAttribute('cx', rpx); rightPupil.setAttribute('cy', rpy);
    leftShine.setAttribute('cx', lpx - 5); leftShine.setAttribute('cy', lpy - 6);
    rightShine.setAttribute('cx', rpx - 5); rightShine.setAttribute('cy', rpy - 6);
    var pupilVisible = scleraScaleY > 0.22 ? 1 : 0;
    leftPupil.style.opacity = rightPupil.style.opacity = leftShine.style.opacity = rightShine.style.opacity = pupilVisible;

    browL.setAttribute('transform', 'translate(' + EYE_L.x + ',' + (EYE_L.y - 46 + exprCur.browY) + ') rotate(' + (-exprCur.browAngle) + ')');
    browR.setAttribute('transform', 'translate(' + EYE_R.x + ',' + (EYE_R.y - 46 + exprCur.browY) + ') rotate(' + (exprCur.browAngle) + ')');

    var my = 258;
    mouthSmile.setAttribute('d', 'M ' + (200 - exprCur.mouthWidth) + ' ' + my + ' Q 200 ' + (my + exprCur.mouthCurve) + ' ' + (200 + exprCur.mouthWidth) + ' ' + my);
    mouthSmile.style.opacity = exprCur.smileOp;
    mouthO.style.opacity = exprCur.oOp;
    mouthSleep.style.opacity = exprCur.sleepOp;

    leftCheek.style.opacity = exprCur.blush * 0.7;
    rightCheek.style.opacity = exprCur.blush * 0.7;

    if (mode === 'sleep' && Math.random() < 0.01) {
      spawnParticle('zzz', creature.x + half * 0.5, creature.y - half * 1.1, 10);
    }

    var totalY = jumpOffset + walkBob * -1;
    wrap.style.left = (creature.x - half) + 'px';
    wrap.style.top = (creature.y - half + totalY) + 'px';
    squashGroup.setAttribute('transform',
      'translate(200,300) scale(' + squashX + ',' + squashY + ') rotate(' + spinAngle + ') translate(-200,-300)'
    );

    var airAmount = clamp(-jumpOffset / 140, 0, 1);
    shadow.setAttribute('opacity', 0.25 * (1 - airAmount * 0.8));
    shadow.setAttribute('rx', 110 * (1 - airAmount * 0.3));

    updateBall(dt, timeNow);

    requestAnimationFrame(frame);
  }

  var lpx = 0, lpy = 0, rpx = 0, rpy = 0;
  var blinkT = 0, blinking = false, blinkStart = 0, nextBlinkAt = now() + 1500 + Math.random() * 2500;
  var BLINK_DUR = 160;

  requestAnimationFrame(frame);

  setTimeout(function () {
    var hEl = document.getElementById('hint');
    if (hEl) hEl.style.opacity = '0';
  }, 7000);
})();
</script>
</body>
